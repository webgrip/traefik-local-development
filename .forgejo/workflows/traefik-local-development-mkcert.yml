name: Build and push webgrip/traefik-local-development-mkcert:latest

# Forgejo mirror of the former .github workflow (forgejo-port-workflows).
#   - runs-on: docker (the in-cluster runner; its dind sidecar provides DOCKER_HOST, and the
#     privileged daemon lets setup-qemu install binfmt for the arm64 half of the build)
#   - DOCKER_USERNAME / DOCKER_TOKEN are NOT provisioned as Forgejo org secrets yet (VIK-316).
#     Manual-dispatch-only, so nothing runs until someone triggers it — provision before running.

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ops/docker/mkcert
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            webgrip/traefik-local-development-mkcert:latest
            webgrip/traefik-local-development-mkcert:${{ github.sha }}
